<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Library · Between the Lines</title>
  <meta name="description" content="Between the Lines: a study-podcast platform where Story meets Science.">

  <!-- Logo in the browser tab and on phone home screens -->
  <link rel="icon" type="image/png" href="images/favicon-3-black-script.png">
  <link rel="apple-touch-icon" href="images/favicon-3-black-script.png">

  <!-- Fonts: Playfair Display (headings), Pinyon Script (decorative), Jost (text) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Pinyon+Script&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <!-- Our one shared stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>

<!-- data-page tells app.js which menu link to highlight -->
<body data-page="library">
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="layout">
    <!-- Empty on purpose: js/app.js builds the menu here -->
    <nav id="sidebar"></nav>

    <main id="main" class="main">

      <header class="page-head">
        <span class="pill">/library</span>
        <h1>The Library</h1>
        <p class="lead">Every book we study, on shelves. Search and filter by subject, era and author.</p>
      </header>

      <!-- ===== FILTERS =====
           The options inside the <select> menus are added by
           js/library.js from books.json, so they are never out of date. -->
      <form class="card filters-card" id="filters" role="search">
        <div class="filters">
          <div class="field">
            <label for="f-search">Search</label>
            <input class="search-input" id="f-search" type="search" placeholder="Title, author or subject" autocomplete="off">
          </div>
          <div class="field">
            <label for="f-subject">Subject</label>
            <select id="f-subject"><option value="">All subjects</option></select>
          </div>
          <div class="field">
            <label for="f-era">Era</label>
            <select id="f-era"><option value="">All eras</option></select>
          </div>
          <div class="field">
            <label for="f-author">Author</label>
            <select id="f-author"><option value="">All authors</option></select>
          </div>
        </div>

        <div class="filters-bottom">
          <div>
            <label class="checkbox"><input type="checkbox" id="f-episode"> Only books with an episode</label>
            <label class="checkbox"><input type="checkbox" id="f-proposed" checked> Include proposed books</label>
            <button type="button" class="text-btn" id="f-reset">Reset filters</button>
          </div>
          <div class="toggle" role="group" aria-label="View">
            <button type="button" id="view-shelves" aria-pressed="true">Shelves</button>
            <button type="button" id="view-grid" aria-pressed="false">Grid</button>
          </div>
        </div>
      </form>

      <!-- "Showing 6 books" (aria-live: screen readers announce changes) -->
      <p class="result-count" id="result-count" aria-live="polite"></p>

      <!-- The books appear here (filled by js/library.js) -->
      <div id="books">
        <p class="notice">Loading books…</p>
      </div>

    </main>
  </div>

  <!-- Scripts go at the end, so the HTML above already exists -->
  <script src="js/app.js"></script>
  <script src="js/library.js"></script>
</body>
</html>
